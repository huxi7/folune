# [INPUT]: 当前公开仓库、Git Tag、Production VITE 公开变量与内置 GITHUB_TOKEN
# [OUTPUT]: 当前仓库 Release 的 macOS DMG、Windows EXE/RELEASES/nupkg 与 ICO
# [POS]: 双平台构建通过后在源码仓库发布完整版本；普通 push 不发布，手动触发只构建
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'app/**', '.github/workflows/desktop-release.yml', 'package.json']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/')
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Folune $RELEASE_TAG" --notes-from-tag
          fi
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CHAT_BASE_URL: ${{ vars.VITE_CHAT_BASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Set tag version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const s=require("semver");const t=process.env.RELEASE_TAG;if(!/^v\d+\.\d+\.\d+$/.test(t)||!s.valid(t))throw new Error("Only stable vX.Y.Z tags are supported")'
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Verify
        run: npm run electron:test
      - name: Build installers
        run: npm run electron:make
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload installers to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" desktop/release/* --clobber
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > release.json
          jq -e --arg package "Folune-${RELEASE_TAG#v}-full.nupkg" '
            .draft and
            ((.assets | map(.name) | sort) ==
              (["folune-macos-arm64.dmg", "folune-windows-x64.exe", "RELEASES", "icon.ico", $package] | sort)) and
            all(.assets[]; .state == "uploaded" and .size > 0)
          ' release.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
