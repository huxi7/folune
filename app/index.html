<!doctype html>
<!--
  [INPUT]: 依赖 src/main.tsx 的浏览器端 React 入口、ThemeProvider 存储键、prefers-color-scheme 与 Vite MODE 替换，依赖品牌母图等比缩放的 PNG favicon
  [OUTPUT]: 对外提供 V1 Classic Blueprint 默认画布、App 首屏同步解析 system/light/dark、Landing 预绘浅色画布、品牌 favicon 和 root 挂载点
  [POS]: app 根 HTML 入口，被 Vite dev/build 消费
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const storedTheme = window.localStorage.getItem("supernote-theme");
          const theme = ["system", "light", "dark"].includes(storedTheme ?? "")
            ? storedTheme
            : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const useDark = theme === "dark" || (theme === "system" && prefersDark);
          const isLandingRoute = window.location.pathname === "/";
          root.classList.toggle("dark", useDark && !isLandingRoute);
        } catch {
          root.classList.remove("dark");
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <title>Folune — Write first</title>
    <meta name="application-name" content="Folune" />
    <meta name="description" content="Folune — Write first." />
    <meta property="og:site_name" content="Folune" />
    <meta property="og:title" content="Folune — Write first" />
    <meta property="og:description" content="Folune — Write first." />
    <meta name="twitter:title" content="Folune — Write first" />
    <meta name="twitter:description" content="Folune — Write first." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
